<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Lotería Don Clemente - 32 Cartas / 20 Clientes</title>

<style>

*{
 box-sizing:border-box;
 font-family:Arial,sans-serif
}

html{
 width:100%;
 height:100%;
}

body{
 margin:0;
 background:#f5f2ea;
 color:#111;
 width:100vw;
 min-height:100dvh;
 overflow-x:hidden;
}

.topbar{
 background:#0a2a4a;
 color:#fff;
 text-align:center;
 padding:8px;
 border-bottom:4px solid #ffee00
}

.topbar h1{
 margin:0;
 font-size:clamp(20px,3vw,34px)
}

/* ===== CONTENEDOR PEGADO A LA IZQUIERDA - ADAPTADO LANDSCAPE ===== */

.contenedor{
 max-width:100vw;
 width:100%;
 margin-left:0;
 margin-right:auto;
 padding:10px;
 transform:translateY(-12px);
 min-height:calc(100dvh - 55px);
}

.encabezado{
 display:grid;
 grid-template-columns:
  62px
  minmax(240px,1fr)
  minmax(280px,410px)
  minmax(240px,1fr)
  62px;
 align-items:center;
 gap:6px 8px;
 margin-bottom:8px;
}

.precio{
 grid-column:2;
 font-size:clamp(38px,5vw,70px);
 font-weight:900;
 text-align:center;
}

.premios{
 grid-column:4;
 text-align:center;
 font-size:clamp(16px,2vw,27px);
 font-weight:900;
 line-height:1.1;
}

.cliente{
 width:62px;
 height:62px;
 border-radius:50%;
 border:3px solid #fff;
 background:#c99b35;
 color:#fff;
 font-weight:900;
 font-size:27px;
 box-shadow:0 3px 7px #777;
 cursor:pointer;
 transition:.2s
}

.cliente:hover{
 transform:scale(1.05)
}

.cliente.oculto{
 visibility:hidden;
 opacity:0;
 transform:scale(.3);
 pointer-events:none
}

.cliente.ganador{
 opacity:.45;
 filter:grayscale(100%);
 background:#555;
 color:#ffee00;
 border:3px solid #ffee00;
 box-shadow:0 0 0 3px #111,0 0 12px #ffee00;
 cursor:default;
}

.cliente.ganador:hover{
 transform:none;
}

.tablero{
 display:grid;
 grid-template-columns:
  62px
  minmax(240px,1fr)
  minmax(280px,410px)
  minmax(240px,1fr)
  62px;
 grid-template-rows:auto auto;
 gap:6px 8px;
 align-items:stretch;
 width:100%;
}

.lateral{
 position:relative;
 display:block;
 min-height:100%;
}

.lateral .cliente{
 position:absolute;
 width:70px;
 height:70px;
}

.izq{
 grid-column:1;
 grid-row:1
}

.der{
 grid-column:5;
 grid-row:1
}

.izq .cliente:nth-child(1){
 top:0;
 left:50%;
 transform:translate(-50%,calc(-50% - 5mm));
}

.izq .cliente:nth-child(2){
 top:12.5%;
 left:50%;
 transform:translate(-50%,-50%);
}

.izq .cliente:nth-child(3){
 top:37.5%;
 left:50%;
 transform:translate(-50%,-50%);
}

.izq .cliente:nth-child(4){
 top:62.5%;
 left:50%;
 transform:translate(-50%,-50%);
}

.izq .cliente:nth-child(5){
 top:87.5%;
 left:50%;
 transform:translate(-50%,-50%);
}

.izq .cliente:nth-child(6){
 top:100%;
 left:100%;
 transform:translate(-100%,calc(-50% + 5mm));
}

.der .cliente:nth-child(1){
 top:0;
 left:50%;
 transform:translate(-50%,calc(-50% - 5mm));
}

.der .cliente:nth-child(2){
 top:12.5%;
 left:50%;
 transform:translate(-50%,-50%);
}

.der .cliente:nth-child(3){
 top:37.5%;
 left:50%;
 transform:translate(-50%,-50%);
}

.der .cliente:nth-child(4){
 top:62.5%;
 left:50%;
 transform:translate(-50%,-50%);
}

.der .cliente:nth-child(5){
 top:87.5%;
 left:50%;
 transform:translate(-50%,-50%);
}

.der .cliente:nth-child(6){
 top:100%;
 left:0;
 transform:translate(0,calc(-50% + 5mm));
}

.baraja{
 border:4px solid #c99b35;
 border-radius:10px;
 padding:5px;
 background:#fff;
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:4px;
 min-width:0;
 min-height:0
}

.izqbar{
 grid-column:2;
 grid-row:1
}

.derbar{
 grid-column:4;
 grid-row:1
}

.carta-mini{
 position:relative;
 aspect-ratio:.72;
 min-width:0;
 min-height:0;
 border:2px solid #fff;
 border-radius:4px;
 overflow:hidden;
 box-shadow:0 1px 4px #888;
 background:#ddd
}

.carta-mini>img{
 width:100%;
 height:100%;
 object-fit:fill;
 display:block
}

.numero{
 position:absolute;
 z-index:2;
 top:2px;
 left:3px;
 background:transparent;
 color:transparent;
 border:none;
 padding:1px 4px;
 font-size:12px;
 font-weight:900
}

.tapada{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 display:none;
 overflow:hidden;
 z-index:5;
}

.tapaImg{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:fill;
 display:block;
 margin:0;
 padding:0;
}

.carta-mini.salio .tapada{
 display:block;
}

.carta-mini.salio .numero{
 display:none;
}

.centro{
 grid-column:3;
 grid-row:1;
 text-align:center
}

.acumulado{
 display:inline-block;
 background:#111;
 color:#fff;
 border-radius:12px;
 padding:4px 20px;
 font-weight:900
}

.monto{
 border:4px solid #c99b35;
 background:#fff;
 border-radius:10px;
 font-size:42px;
 font-weight:900;
 padding:2px 25px;
 margin:3px auto 8px;
 max-width:230px
}

.carta-grande{
 width:min(100%,260px);
 margin:auto;
 background:#fff;
 border:5px solid #c99b35;
 border-radius:14px;
 padding:6px;
 box-shadow:0 4px 10px #777
}

.carta-grande img{
 width:100%;
 height:auto;
 aspect-ratio:.72;
 object-fit:contain;
 display:block;
 border-radius:6px
}

.nombre{
 font-size:clamp(20px,2.5vw,30px);
 font-weight:900;
 margin:5px
}

.cantando{
 background:#111;
 color:#fff;
 border-radius:9px;
 padding:5px;
 font-weight:900;
 font-size:18px
}

#estado{
 min-height:22px;
 font-weight:900;
 margin:5px
}

.controles{
 display:flex;
 justify-content:center;
 gap:6px;
 flex-wrap:wrap
}

.controles button{
 border:0;
 border-radius:9px;
 padding:10px 13px;
 font-weight:900;
 cursor:pointer
}

#gritar{
 background:#ffee00
}

#auto{
 background:#0a2a4a;
 color:#fff
}

#nuevo{
 background:#7030a0;
 color:#fff
}

.abajo{
 grid-column:2/5;
 grid-row:2;
 display:grid;
 grid-template-columns:
  minmax(0,1fr)
  minmax(280px,410px)
  minmax(0,1fr);
 gap:8px;
 align-items:start;
}

.abajo .grupo{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:7px;
 justify-items:center;
 width:100%
}

.abajo #clientesAbajoIzq{
 grid-column:1
}

.abajo #clientesAbajoDer{
 grid-column:3
}

.abajo .cliente{
 width:64px;
 height:64px
}

.instruccion{
 display:none
}

.estado-linea{
 margin-top:4px;
 color:#555
}

/* ===== ADAPTACION LANDSCAPE - CELULAR ANDROID ===== */

@media(max-width:900px){

 .contenedor{
  width:100vw;
  max-width:100vw;
  margin-left:0;
  margin-right:0;
  padding:6px;
  transform:none;
 }

 .lateral{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  align-items:center;
  min-height:100%;

 .lateral .cliente{
  position:static;
  width:46px;
  height:46px;
  transform:none;
 }

 .encabezado{
  grid-template-columns:55px 1fr 55px;
 }

 .encabezado .precio{
  grid-column:2;
  grid-row:1;
 }

 .encabezado .premios{
  grid-column:2;
  grid-row:2;
 }

 .tablero{
  grid-template-columns:42px 1fr 1fr 42px;
  grid-template-rows:auto auto auto;
  width:100vw;
 }

  grid-column:1/5;
  grid-row:1
 }

  grid-row:2
 }

 .izqbar{
  grid-column:2;
  grid-row:2
 }

 .derbar{
  grid-column:3;
  grid-row:2
 }

 .der{
  grid-column:4;
  grid-row:2
 }

 .abajo{
  grid-column:1/5;
  grid-row:3;
  flex-wrap:wrap;
  width:100%;
 }

 .abajo .cliente{
  width:46px;
  height:46px;
  font-size:20px
 }

 .carta-grande{
  max-width:260px
 }
}
