<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loteria Don Clemente COMPACTA</title>
<style>
*{box-sizing:border-box;font-family:Arial;margin:0;padding:0}
body{background:#f5f2ea;overflow:hidden;height:100dvh;width:100vw}
.topbar{background:#0a2a4a;color:#fff;text-align:center;padding:2px;font-size:11px;border-bottom:2px solid #ffee00;height:18px;line-height:14px}
.encabezado{display:flex;justify-content:space-between;font-weight:900;padding:1px 6px;font-size:11px;height:14px}
.tablero{display:grid;grid-template-columns:32px 1fr 140px 1fr 32px;gap:2px;padding:2px;height:calc(100dvh - 32px)}
.baraja{border:2px solid #c99b35;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;padding:1px;border-radius:4px}
.carta{aspect-ratio:.72;background:#ddd;position:relative;overflow:hidden;border-radius:2px;font-size:0}
.carta img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.carta.salio::after{content:'';position:absolute;inset:0;background:url(CARTAS/TAPA1.jpg) center/cover}
.cliente{width:26px;height:26px;border-radius:50%;background:#c99b35;color:#fff;border:2px solid #fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;margin:2px auto;cursor:pointer}
.centro{text-align:center;display:flex;flex-direction:column;gap:2px}
.monto{border:2px solid #c99b35;background:#fff;font-size:18px;font-weight:900;border-radius:4px;line-height:1}
.carta-grande{width:100px;height:130px;margin:0 auto;background:#fff;border:2px solid #c99b35;border-radius:6px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900}
.carta-grande img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#nombre,#estado{font-size:10px;font-weight:900;line-height:1.1}
button{padding:4px 6px;border:0;border-radius:4px;font-weight:900;font-size:10px;cursor:pointer}
#gritar{background:#ffee00}
#auto{background:#0a2a4a;color:#fff}
#nuevo{background:#7030a0;color:#fff}
</style>
</head>
<body>
<div class="topbar">LOTERIA DON CLEMENTE</div>
<div class="encabezado"><div>$20</div><div>1ra:100 2da:100 3ra:100</div></div>
<div class="tablero">
<div id="cIzq"></div>
<div class="baraja" id="bIzq"></div>
<div class="centro">
<div style="background:#111;color:#fff;border-radius:4px;font-size:9px;padding:1px">ACUMULADO</div>
<div class="monto">80</div>
<div class="carta-grande" id="cG"><span id="cGtxt">1</span><img id="cGimg" onerror="this.style.display='none'"></div>
<div id="nombre">LISTO</div>
<div id="estado">54 disponibles</div>
<div><button id="gritar" onclick="gritar()">GRITAR</button><button id="auto" onclick="auto()">AUTO</button><button id="nuevo" onclick="nuevo()">NUEVO</button></div>
</div>
<div class="baraja" id="bDer"></div>
<div id="cDer"></div>
</div>
<script>
const N=["EL GALLO","EL DIABLITO","LA DAMA","EL CATRIN","EL PARAGUAS","LA SIRENA","LA ESCALERA","LA BOTELLA","EL BARRIL","EL ARBOL","EL MELON","EL VALIENTE","EL GORRITO","LA MUERTE","LA PERA","LA BANDERA","EL BANDOLON","EL VIOLONCELLO","LA GARZA","EL PAJARO","LA MANO","LA BOTA","LA LUNA","EL COTORRO","EL BORRACHO","EL NEGRITO","EL CORAZON","LA SANDIA","EL TAMBOR","EL CAMARON","LAS JARAS","EL MUSICO","LA ARAÑA","EL SOLDADO","LA ESTRELLA","EL CAZO","EL MUNDO","EL APACHE","EL NOPAL","EL ALACRAN","LA ROSA","LA CALAVERA","LA CAMPANA","EL CANTARITO","EL VENADO","EL SOL","LA CORONA","LA CHALUPA","EL PINO","EL PESCADO","LA PALMA","LA MACETA","EL ARPA","LA RANA"];
let disp=[],sal=new Set(),timer=null,gan=new Set(),prem=0;
function ficha(n){let d=document.createElement("div");d.className="cliente";d.id="cl"+n;d.textContent=n;return d}
function initClientes(){let iz=document.getElementById("cIzq"),de=document.getElementById("cDer");iz.innerHTML="";de.innerHTML="";for(let i=1;i<=10;i++)iz.appendChild(ficha(i));for(let i=11;i<=20;i++)de.appendChild(ficha(i))}
function initBaraja(){let a=document.getElementById("bIzq"),b=document.getElementById("bDer");a.innerHTML="";b.innerHTML="";for(let i=1;i<=32;i++){let c=document.createElement("div");c.className="carta";c.id="m"+i;c.innerHTML=`<img src="CARTAS/${i}.jpg" loading="eager">`;if(i<=16)a.appendChild(c);else b.appendChild(c)}}
function prep(){disp=[...Array(54).keys()].map(i=>i+1);sal.clear();prem=0;gan.clear();document.querySelectorAll(".carta").forEach(e=>e.classList.remove("salio"))}
function gritar(){if(!disp.length)return;let k=Math.floor(Math.random()*disp.length);let n=disp.splice(k,1)[0];sal.add(n);document.getElementById("cGtxt").textContent=n;let img=document.getElementById("cGimg");img.src=`CARTAS/${n}.jpg`;img.style.display="block";document.getElementById("nombre").textContent=N[n-1];document.getElementById("estado").textContent=n+"-"+N[n-1];let mm=document.getElementById("m"+n);if(mm)mm.classList.add("salio");comp()}
const LIN={1:[1,2,3,4],2:[5,6,7,8],3:[9,10,11,12],4:[13,14,15,16],5:[17,18,19,20],6:[21,22,23,24],7:[25,26,27,28],8:[29,30,31,32],9
