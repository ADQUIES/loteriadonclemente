<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
<title>Lotería Don Clemente - 32 Cartas / 20 Clientes</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
html{width:100%;height:100%}
body{margin:0;background:#f5f2ea;color:#111;width:100%;min-height:100dvh;overflow-x:hidden}
.topbar{background:#0a2a4a;color:#fff;text-align:center;padding:8px;border-bottom:4px solid #ffee00}
.topbar h1{margin:0;font-size:clamp(20px,3vw,34px)}
.contenedor{max-width:1500px;width:100%;margin:0 auto;padding:10px;transform:translateY(-12px);min-height:calc(100dvh - 55px)}
.encabezado{display:grid;grid-template-columns:62px minmax(240px,1fr) minmax(280px,410px) minmax(240px,1fr) 62px;align-items:center;gap:6px 8px;margin-bottom:8px}
.precio{grid-column:2;font-size:clamp(38px,5vw,70px);font-weight:900;text-align:center}
.premios{grid-column:4;text-align:center;font-size:clamp(16px,2vw,27px);font-weight:900;line-height:1.1}
.cliente{width:62px;height:62px;border-radius:50%;border:3px solid #fff;background:#c99b35;color:#fff;font-weight:900;font-size:27px;box-shadow:0 3px 7px #777;cursor:pointer;transition:.2s}
.cliente:hover{transform:scale(1.05)}
.cliente.oculto{visibility:hidden;opacity:0;transform:scale(.3);pointer-events:none}
.cliente.ganador{opacity:.45;filter:grayscale(100%);background:#555;color:#ffee00;border:3px solid #ffee00;box-shadow:0 0 0 3px #111,0 0 12px #ffee00;cursor:default}
.tablero{display:grid;grid-template-columns:62px minmax(240px,1fr) minmax(280px,410px) minmax(240px,1fr) 62px;grid-template-rows:auto auto;gap:6px 8px;align-items:stretch;width:100%}
.lateral{position:relative;display:block;min-height:100%}
.lateral.cliente{position:absolute;width:70px;height:70px}
.izq{grid-column:1;grid-row:1}.der{grid-column:5;grid-row:1}
.izq.cliente:nth-child(1){top:0;left:50%;transform:translate(-50%,calc(-50% - 5mm))}
.izq.cliente:nth-child(2){top:12.5%;left:50%;transform:translate(-50%,-50%)}
.izq.cliente:nth-child(3){top:37.5%;left:50%;transform:translate(-50%,-50%)}
.izq.cliente:nth-child(4){top:62.5%;left:50%;transform:translate(-50%,-50%)}
.izq.cliente:nth-child(5){top:87.5%;left:50%;transform:translate(-50%,-50%)}
.izq.cliente:nth-child(6){top:100%;left:100%;transform:translate(-100%,calc(-50% + 5mm))}
.der.cliente:nth-child(1){top:0;left:50%;transform:translate(-50%,calc(-50% - 5mm))}
.der.cliente:nth-child(2){top:12.5%;left:50%;transform:translate(-50%,-50%)}
.der.cliente:nth-child(3){top:37.5%;left:50%;transform:translate(-50%,-50%)}
.der.cliente:nth-child(4){top:62.5%;left:50%;transform:translate(-50%,-50%)}
.der.cliente:nth-child(5){top:87.5%;left:50%;transform:translate(-50%,-50%)}
.der.cliente:nth-child(6){top:100%;left:0;transform:translate(0,calc(-50% + 5mm))}
.baraja{border:4px solid #c99b35;border-radius:10px;padding:5px;background:#fff;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;min-width:0}
.izqbar{grid-column:2;grid-row:1}.derbar{grid-column:4;grid-row:1}
.carta-mini{position:relative;aspect-ratio:.72;border:2px solid #fff;border-radius:4px;overflow:hidden;box-shadow:0 1px 4px #888;background:#ddd}
.carta-mini>img{width:100%;height:100%;object-fit:fill;display:block}
.numero{position:absolute;z-index:2;top:2px;left:3px;color:transparent}
.tapada{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:5}
.tapaImg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.carta-mini.salio.tapada{display:block}.carta-mini.salio.numero{display:none}
.centro{grid-column:3;grid-row:1;text-align:center}
.acumulado{display:inline-block;background:#111;color:#fff;border-radius:12px;padding:4px 20px;font-weight:900}
.monto{border:4px solid #c99b35;background:#fff;border-radius:10px;font-size:42px;font-weight:900;padding:2px 25px;margin:3px auto 8px;max-width:230px}
.carta-grande{width:min(100%,260px);margin:auto;background:#fff;border:5px solid #c99b35;border-radius:14px;padding:6px;box-shadow:0 4px 10px #777}
.carta-grande img{width:100%;aspect-ratio:.72;object-fit:contain;display:block;border-radius:6px}
.nombre{font-size:clamp(20px,2.5vw,30px);font-weight:900;margin:5px}
.cantando{background:#111;color:#fff;border-radius:9px;padding:5px;font-weight:900;font-size:18px}
#estado{min-height:22px;font-weight:900;margin:5px}
.controles{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.controles button{border:0;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer}
#gritar{background:#ffee00}#auto{background:#0a2a4a;color:#fff}#nuevo{background:#7030a0;color:#fff}
.abajo{grid-column:2/5;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,410px) minmax(0,1fr);gap:8px}
.abajo.grupo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;justify-items:center;width:100%}
@media(max-width:900px){
.contenedor{width:100vw;max-width:100vw;margin:0;padding:6px;transform:none;min-height:100dvh}
.lateral{display:flex;flex-direction:column;justify-content:space-around;align-items:center}
.lateral.cliente{position:static;width:46px;height:46px;transform:none}
.encabezado{grid-template-columns:55px 1fr 55px}.encabezado.precio{grid-column:2;grid-row:1}.encabezado.premios{grid-column:2;grid-row:2}
.tablero{grid-template-columns:42px 1fr 1fr 42px;grid-template-rows:auto auto auto}
.centro{grid-column:1/5;grid-row:1}.izq{grid-column:1;grid-row:2}.izqbar{grid-column:2;grid-row:2}.derbar{grid-column:3;grid-row:2}.der{grid-column:4;grid-row:2}.abajo{grid-column:1/5;grid-row:3}
}
@media(max-width:900px) and (orientation:landscape){
.contenedor{padding:2px 4px}
.carta-grande{width:min(38vh,200px)}
.monto{font-size:26px}
.topbar h1{font-size:15px}
.topbar{padding:2px}
}
</style>
</head>
<body>
<div class="topbar"><h1>🎴 LOTERÍA DON CLEMENTE 🎴</h1></div>
<div class="contenedor">
<div class="encabezado"><div class="precio">$20</div><div class="premios">1ra Línea: 100<br>2da Línea: 100<br>3ra Línea: 100</div></div>
<div class="tablero">
<div class="lateral izq" id="clientesIzq"></div>
<div class="baraja izqbar" id="barajaIzq"></div>
<div class="centro">
<div class="acumulado">ACUMULADO</div><div class="monto">80</div>
<div class="carta-grande"><img id="cartaActual" alt="Carta actual"></div>
<div class="nombre" id="nombreActual">LISTO</div>
<div class="cantando">CANTANDO: <span id="textoCantando">—</span></div>
<div id="estado">54 cartas disponibles en la baraja.</div>
<div class="controles">
<button id="gritar" onclick="gritarCarta()">🔊 GRITAR CARTA</button>
<button id="auto" onclick="automatico()">▶ AUTOMÁTICO</button>
<button id="nuevo" onclick="nuevoJuego()">🔄 NUEVO JUEGO</button>
</div>
</div>
<div class="baraja derbar" id="barajaDer"></div>
<div class="lateral der" id="clientesDer"></div>
<div class="abajo"><div class="grupo" id="clientesAbajoIzq"></div><div class="grupo" id="clientesAbajoDer"></div></div>
</div>
</div>
<script>
const NOMBRES=["EL GALLO","EL DIABLITO","LA DAMA","EL CATRÍN","EL PARAGUAS","LA SIRENA","LA ESCALERA","LA BOTELLA","EL BARRIL","EL ÁRBOL","EL MELÓN","EL VALIENTE","EL GORRITO","LA MUERTE","LA PERA","LA BANDERA","EL BANDOLÓN","EL VIOLONCELLO","LA GARZA","EL PÁJARO","LA MANO","LA BOTA","LA LUNA","EL COTORRO","EL BORRACHO","EL NEGRITO","EL CORAZÓN","LA SANDÍA","EL TAMBOR","EL CAMARÓN","LAS JARAS","EL MÚSICO","LA ARAÑA","EL SOLDADO","LA ESTRELLA","EL CAZO","EL MUNDO","EL APACHE","EL NOPAL","EL ALACRÁN","LA ROSA","LA CALAVERA","LA CAMPANA","EL CANTARITO","EL VENADO","EL SOL","LA CORONA","LA CHALUPA","EL PINO","EL PESCADO","LA PALMA","LA MACETA","EL ARPA","LA RANA"];
let disponibles=[],salidas=new Set(),clientesOcultos=new Set(),reloj=null,ganadores=new Set(),premiosObtenidos=0;const MAX_PREMIOS=3;const TAPA="CARTAS/TAPA1.jpg";
function urlCarta(n){return `CARTAS/${n}.jpg`}
function configurarImagen(img,n){if(!img)return;img.src=urlCarta(n);img.alt=NOMBRES[n-1];img.onerror=()=>{img.style.background="#ddd"}}
function ficha(n){const b=document.createElement("button");b.className="cliente";b.id="cliente"+n;b.textContent=n;b.title="Cliente "+n;b.onclick=()=>toggleCliente(n);return b}
function crearClientes(){const izq=document.getElementById("clientesIzq"),der=document.getElementById("clientesDer"),ai=document.getElementById("clientesAbajoIzq"),ad=document.getElementById("clientesAbajoDer");izq.innerHTML="";der.innerHTML="";ai.innerHTML="";ad.innerHTML="";for(let n=1;n<=6;n++)izq.appendChild(ficha(n));for(let n=20;n>=15;n--)der.appendChild(ficha(n));for(let n=7;n<=10;n++)ai.appendChild(ficha(n));for(let n=11;n<=14;n++)ad.appendChild(ficha(n))}
function crearBaraja(){const a=document.getElementById("barajaIzq"),b=document.getElementById("barajaDer");a.innerHTML="";b.innerHTML="";for(let n=1;n<=32;n++){const c=document.createElement("div");c.className="carta-mini";c.id="mini"+n;c.innerHTML=`<span class="numero">${n}</span><img id="imgMini${n}"><div class="tapada"><img class="tapaImg" src="${TAPA}"></div>`;configurarImagen(c.querySelector("#imgMini"+n),n);if(n<=16)a.appendChild(c);else b.appendChild(c)}}
function toggleCliente(n){const el=document.getElementById("cliente"+n);if(!el||el.classList.contains("ganador"))return;if(clientesOcultos.has(n)){clientesOcultos.delete(n);el.classList.remove("oculto")}else{clientesOcultos.add(n);el.classList.add("oculto")}}
function marcarGanador(cliente,numeroPremio){const ficha=document.getElementById("cliente"+cliente);if(!ficha)return;ficha.classList.remove("oculto");ficha.classList.add("ganador");ficha.textContent=numeroPremio;ficha.onclick=null}
function preparar(){disponibles=Array.from({length:54},(_,i)=>i+1);salidas.clear();premiosObtenidos=0;for(let n=1;n<=32;n++){document.getElementById("mini"+n)?.classList.remove("salio")}configurarImagen(document.getElementById("cartaActual"),1);document.getElementById("nombreActual").textContent="LISTO";document.getElementById("textoCantando").textContent="—";document.getElementById("estado").textContent="54 cartas disponibles en la baraja. Tablero: 32 cartas.";document.getElementById("auto").textContent="▶ AUTOMÁTICO"}
function gritarCarta(){if(premiosObtenidos>=3){parar();document.getElementById("estado").textContent="🎉 ¡LOS 3 PREMIOS YA FUERON GANADOS! 🎉";return}if(!disponibles.length){parar();return}const i=Math.floor(Math.random()*disponibles.length);const n=disponibles.splice(i,1)[0];salidas.add(n);configurarImagen(document.getElementById("cartaActual"),n);document.getElementById("nombreActual").textContent=NOMBRES[n-1];document.getElementById("textoCantando").textContent=NOMBRES[n-1];document.getElementById("mini"+n)?.classList.add("salio");document.getElementById("estado").textContent=`Carta ${n} • ${NOMBRES[n-1]} • ${disponibles.length} restantes`;comprobarGanadores();if("speechSynthesis" in window){speechSynthesis.cancel();const voz=new SpeechSynthesisUtterance(NOMBRES[n-1]);voz.lang="es-MX";voz.rate=.82;speechSynthesis.speak(voz)}}
const LINEAS_CLIENTES={1:[1,2,3,4],2:[5,6,7,8],3:[9,10,11,12],4:[13,14,15,16],5:[17,18,19,20],6:[21,22,23,24],7:[25,26,27,28],8:[29,30,31,32],9:[1,6,11,16],10:[17,22,27,32],11:[4,9,14,19],12:[13,18,23,28],13:[5,10,15,20],14:[8,13,18,23],15:[2,7,12,17],16:[16,21,26,31],17:[3,8,13,18],18:[15,20,25,30],19:[4,14,24,32],20:[1,11,21,31]};
function comprobarGanadores(){for(let cliente=1;cliente<=20;cliente++){if(ganadores.has(cliente))continue;const linea=LINEAS_CLIENTES[cliente]||[];if(linea.every(c=>salidas.has(c))){ganadores.add(cliente);premiosObtenidos++;marcarGanador(cliente,premiosObtenidos);const texto=`¡Lotería! ¡Ganó el cliente ${cliente}!`;document.getElementById("estado").textContent=`🎉 ${texto} • PREMIO ${premiosObtenidos} DE 3`;if("speechSynthesis" in window){speechSynthesis.cancel();const voz=new SpeechSynthesisUtterance(texto);voz.lang="es-MX";voz.rate=.78;voz.pitch=1.1;speechSynthesis.speak(voz)}setTimeout(()=>alert("🎉 ¡LOTERÍA! 🎉\n\n¡Ganó el cliente "+cliente+"!\n\nPremio "+premiosObtenidos+" de 3"),150);if(premiosObtenidos>=3){parar();document.getElementById("estado").textContent="🎉 ¡LOS 3 PREMIOS YA FUERON GANADOS! 🎉";document.getElementById("auto").textContent="🏆 3 PREMIOS ENTREGADOS";return}}}}
function gritarLoteria(c,p){/*reservado*/}
function automatico(){if(premiosObtenidos>=3){parar();return}if(reloj){parar();return}if(!disponibles.length)return;document.getElementById("auto").textContent="⏸ DETENER";gritarCarta();reloj=setInterval(()=>{if(!disponibles.length||premiosObtenidos>=3){parar();return}gritarCarta()},4000)}
function parar(){if(reloj){clearInterval(reloj);reloj=null}document.getElementById("auto").textContent=premiosObtenidos>=3?"🏆 3 PREMIOS ENTREGADOS":"▶ AUTOMÁTICO"}
function nuevoJuego(){parar();ganadores.clear();premiosObtenidos=0;clientesOcultos.clear();for(let n=1;n<=20;n++){const e=document.getElementById("cliente"+n);if(e){e.classList.remove("oculto","ganador");e.textContent=n;e.onclick=()=>toggleCliente(n)}}preparar()}
function iniciarJuego(){crearClientes();crearBaraja();nuevoJuego()}
if(document.readyState==="loading")window.addEventListener("DOMContentLoaded",iniciarJuego);else iniciarJuego();
</script>
</body>
</html>
