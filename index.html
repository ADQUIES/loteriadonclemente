<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"> <!-- Acentos y ñ -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <!-- Para que se ajuste a cualquier celular -->
<title>Lotería Don Clemente - FIX COMPLETO</title>
<style>
/* === RESET BÁSICO === */
*{box-sizing:border-box; font-family:Arial,sans-serif} /* Todos los elementos cuentan borde dentro del tamaño */
html,body{margin:0; padding:0; width:100%; overflow-x:hidden; background:#f5f2ea} /* Quitamos scroll lateral */

/* === BARRA SUPERIOR === */
.topbar{background:#0a2a4a; color:#fff; text-align:center; padding:6px; border-bottom:4px solid #ffee00} /* Fondo azul y borde amarillo */
.topbar h1{margin:0; font-size:clamp(14px,2.5vw,28px)} /* Título que se achica en celular */

/* === CONTENEDOR PRINCIPAL - ESTE ERA TU ERROR === */
.contenedor{
  width:100vw; /* Ocupa 100% del ancho de la ventana */
  max-width:100vw; /* Nunca más de 100% - antes tenías 1500px fijo por eso se cortaba */
  margin:0 auto;
  padding:4px;
}

/* === ENCABEZADO $20 Y PREMIOS === */
.encabezado{
  display:grid; /* Usamos grid para alinear */
  grid-template-columns: 50px 1fr 240px 1fr 50px; /* 5 columnas: 50px para clientes, 1fr flexible, 240px centro */
  align-items:center;
  gap:4px;
}
.precio{grid-column:2; font-size:clamp(28px,5vw,60px); font-weight:900; text-align:center} /* $20 */
.premios{grid-column:4; text-align:center; font-size:clamp(12px,1.5vw,20px); font-weight:900} /* Texto 1ra 2da 3ra */

/* === BOTONES DE CLIENTES (bolitas doradas) === */
.cliente{
  width:46px; height:46px; /* Tamaño reducido para que quepa */
  border-radius:50%; /* Redondo */
  border:3px solid #fff;
  background:#c99b35; /* Dorado */
  color:#fff; font-weight:900; font-size:20px;
  cursor:pointer;
}
.cliente.oculto{visibility:hidden} /* Cuando le picas se esconde */
.cliente.ganador{background:#222; color:#ffee00; border-color:#ffee00} /* Cuando gana */

/* === TABLERO PRINCIPAL - 5 COLUMNAS === */
.tablero{
  display:grid;
  grid-template-columns: 50px 1fr 240px 1fr 50px; /* Mismo que encabezado para que alinee */
  grid-template-rows:auto auto;
  gap:4px;
  width:100%;
}
.lateral{position:relative; min-height:400px} /* Columnas de bolitas laterales */
.lateral .cliente{position:absolute; width:46px; height:46px} /* Bolitas posicionadas absolutas */

/* Posiciones izquierda */
.izq{grid-column:1; grid-row:1}
.izq .cliente:nth-child(1){top:0%; left:50%; transform:translate(-50%,0)}
.izq .cliente:nth-child(2){top:16%; left:50%; transform:translate(-50%,-50%)}
.izq .cliente:nth-child(3){top:32%; left:50%; transform:translate(-50%,-50%)}
.izq .cliente:nth-child(4){top:48%; left:50%; transform:translate(-50%,-50%)}
.izq .cliente:nth-child(5){top:64%; left:50%; transform:translate(-50%,-50%)}
.izq .cliente:nth-child(6){top:80%; left:50%; transform:translate(-50%,-50%)}

/* Posiciones derecha */
.der{grid-column:5; grid-row:1}
.der .cliente:nth-child(1){top:0%; left:50%; transform:translate(-50%,0)}
.der .cliente:nth-child(2){top:16%; left:50%; transform:translate(-50%,-50%)}
.der .cliente:nth-child(3){top:32%; left:50%; transform:translate(-50%,-50%)}
.der .cliente:nth-child(4){top:48%; left:50%; transform:translate(-50%,-50%)}
.der .cliente:nth-child(5){top:64%; left:50%; transform:translate(-50%,-50%)}
.der .cliente:nth-child(6){top:80%; left:50%; transform:translate(-50%,-50%)}

/* === BARAJAS DE 16 CARTAS CADA UNA === */
.baraja{
  border:3px solid #c99b35; /* Borde dorado */
  border-radius:8px;
  background:#fff;
  display:grid;
  grid-template-columns:repeat(4,1fr); /* 4 cartas por fila */
  gap:3px;
  padding:3px;
}
.izqbar{grid-column:2; grid-row:1} /* Baraja izquierda */
.derbar{grid-column:4; grid-row:1} /* Baraja derecha */
.carta-mini{aspect-ratio:.72; border:1px solid #fff; border-radius:4px; overflow:hidden; background:#ddd} /* Cada cartita */
.carta-mini img{width:100%; height:100%; object-fit:cover} /* Imagen ocupa todo */
.tapada{display:none} /* Tapa amarilla cuando sale */
.carta-mini.salio .tapada{display:block; position:absolute; inset:0} /* Si salió, muestra tapa */

/* === CENTRO - ACUMULADO Y CARTA GRANDE === */
.centro{grid-column:3; grid-row:1; text-align:center} /* Columna central */
.acumulado{background:#111; color:#fff; border-radius:10px; padding:2px 12px; font-weight:900; font-size:14px; display:inline-block}
.monto{border:3px solid #c99b35; background:#fff; border-radius:8px; font-size:32px; font-weight:900; margin:4px auto} /* 80 */
.carta-grande{width:100%; max-width:210px; margin:4px auto; background:#fff; border:4px solid #c99b35; border-radius:10px; padding:4px}
.carta-grande img{width:100%; aspect-ratio:.72; object-fit:contain; display:block} /* Carta que se está gritando */
.nombre{font-weight:900; font-size:18px; margin:2px}
.cantando{background:#111; color:#fff; border-radius:6px; padding:3px; font-size:13px; font-weight:900}
#estado{font-weight:900; font-size:12px; margin:4px; min-height:16px}
.controles button{border:0; border-radius:6px; padding:8px 10px; font-weight:900; cursor:pointer; font-size:12px}
#gritar{background:#ffee00} /* Amarillo */
#auto{background:#0a2a4a; color:#fff} /* Azul */
#nuevo{background:#7030a0; color:#fff} /* Morado */

/* === CLIENTES DE ABAJO === */
.abajo{grid-column:2/5; grid-row:2; display:grid; grid-template-columns:1fr 240px 1fr; gap:4px; margin-top:4px}
.abajo .grupo{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; justify-items:center}
</style>
</head>
<body>
<!-- BARRA AZUL -->
<div class="topbar"><h1>🎴 LOTERÍA DON CLEMENTE 🎴</h1></div>

<!-- CONTENEDOR -->
<div class="contenedor">
  <!-- ENCABEZADO -->
  <div class="encabezado">
    <div class="precio">$20</div> <!-- Precio -->
    <div class="premios">1ra:100<br>2da:100<br>3ra:100</div> <!-- Premios -->
  </div>

  <!-- TABLERO -->
  <div class="tablero">
    <div class="lateral izq" id="clientesIzq"></div> <!-- Bolitas 1-6 -->
    <div class="baraja izqbar" id="barajaIzq"></div> <!-- Cartas 1-16 -->
    <div class="centro"> <!-- Centro -->
      <div class="acumulado">ACUMULADO</div>
      <div class="monto">
