<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LOTERÍA DON CLEMENTE - 32 CARTAS</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{
  margin:0;
  background:#f4f1e9;
  color:#111;
  overflow-x:hidden;
}
.topbar{
  background:#0a2a4a;
  color:#fff;
  padding:10px;
  text-align:center;
  border-bottom:4px solid #ffee00;
}
.topbar h1{margin:0;font-size:clamp(20px,3vw,34px)}
.topbar small{font-size:13px}

.contenedor{
  max-width:1500px;
  margin:auto;
  padding:12px;
}

.premios{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
  font-weight:900;
  font-size:clamp(16px,2vw,28px);
}
.precio{
  font-size:clamp(30px,4vw,55px);
}
.premiosTexto{text-align:center;line-height:1.15}

.ficha{
  width:58px;
  height:58px;
  border-radius:50%;
  border:3px solid #fff;
  background:#c99b35;
  color:#fff;
  font-weight:900;
  font-size:25px;
  box-shadow:0 3px 7px #777;
  cursor:pointer;
}
.ficha:hover{transform:scale(1.05)}
.ficha.activa{
  background:#ffee00;
  color:#111;
  border-color:#111;
}

.juego{
  display:grid;
  grid-template-columns:1fr minmax(280px,420px) 1fr;
  gap:15px;
  align-items:start;
}

.baraja{
  border:4px solid #c99b35;
  border-radius:12px;
  padding:7px;
  background:#fff;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}

.carta-mini{
  position:relative;
  aspect-ratio:0.72;
  border:3px solid #fff;
  border-radius:5px;
  overflow:hidden;
  box-shadow:0 1px 4px #888;
  background:#ddd;
}
.carta-mini img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.numero{
  position:absolute;
  top:3px;
  left:4px;
  z-index:3;
  background:#fff;
  border-radius:3px;
  padding:1px 4px;
  font-size:12px;
  font-weight:900;
}
.carta-mini .tapada{
  position:absolute;
  inset:0;
  z-index:5;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
  color:#ffee00;
  font-size:clamp(20px,3vw,35px);
  font-weight:900;
  text-shadow:2px 2px #000;
}
.carta-mini.salio .tapada{display:flex}

.centro{
  text-align:center;
}
.acumulado{
  background:#111;
  color:#fff;
  border-radius:15px;
  padding:5px 15px;
  font-size:18px;
  font-weight:900;
  display:inline-block;
}
.monto{
  border:4px solid #c99b35;
  background:#fff;
  border-radius:12px;
  padding:3px 30px;
  font-size:44px;
  font-weight:900;
  margin:5px auto 10px;
}

.carta-grande{
  position:relative;
  width:100%;
  max-width:380px;
  margin:auto;
  border:6px solid #c99b35;
  border-radius:15px;
  padding:7px;
  background:#fff;
  box-shadow:0 4px 12px #777;
}
.carta-grande img{
  display:block;
  width:100%;
  aspect-ratio:.72;
  object-fit:cover;
  border-radius:7px;
}
.carta-grande .numero-grande{
  position:absolute;
  top:13px;
  left:15px;
  background:#fff;
  padding:3px 8px;
  border-radius:5px;
  font-weight:900;
  font-size:18px;
}
.nombre-carta{
  font-size:clamp(22px,3vw,34px);
  font-weight:900;
  margin:7px 0;
}
.cantando{
  background:#111;
  color:#fff;
  border-radius:10px;
  padding:6px;
  font-size:18px;
  font-weight:900;
}
#estado{
  min-height:24px;
  margin:6px 0;
  font-weight:900;
}

.controles{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin:10px 0;
}
button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}
#btnGritar{background:#ffee00}
#btnAuto{background:#0a2a4a;color:#fff}
#btnNuevo{background:#c99b35;color:#fff}

.fichas-titulo{
  background:#111;
  color:#fff;
  display:inline-block;
  border-radius:10px;
  padding:5px 20px;
  font-weight:900;
  margin-top:8px;
}
.fichas{
  margin-top:5px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  padding:10px;
  border:3px solid #c99b35;
  border-radius:12px;
  background:#fff;
}

@media(max-width:900px){
  .juego{grid-template-columns:1fr}
  .centro{order:-1}
  .baraja{grid-template-columns:repeat(4,1fr)}
  .carta-grande{max-width:300px}
}
</style>
</head>

<body>
<div class="topbar">
  <h1>🎴 LOTERÍA DON CLEMENTE 🎴</h1>
  <small>32 CARTAS • 20 FICHAS</small>
</div>

<div class="contenedor">

  <div class="premios">
    <button class="ficha" id="fichaIzq">1</button>
    <div class="precio">$20</div>
    <div class="premiosTexto">
      1ra Línea: $100<br>
      2da Línea: $100<br>
      3ra Línea: $100
    </div>
    <button class="ficha" id="fichaDer">20</button>
  </div>

  <div class="juego">

    <!-- CARTAS 1 A 16 -->
    <div class="baraja" id="barajaIzq"></div>

    <!-- CARTA QUE SE VA CANTANDO -->
    <div class="centro">
      <div class="acumulado">ACUMULADO</div>
      <div class="monto" id="acumulado">80</div>

      <div class="carta-grande">
        <span class="numero-grande" id="numeroActual">1</span>
        <img id="cartaActual" src="https://loteria.loteria-mexicana.mx/images/cartas/1.jpg" alt="Carta actual">
      </div>

      <div class="cantando">
        CANTANDO: <span id="nombreActual">EL GALLO</span>
      </div>

      <div id="estado">Listo para comenzar.</div>

      <div class="controles">
        <button id="btnGritar" onclick="gritarCarta()">🎤 GRITAR CARTA</button>
        <button id="btnAuto" onclick="alternarAutomatico()">▶ AUTOMÁTICO</button>
        <button id="btnNuevo" onclick="nuevoJuego()">🔄 NUEVO JUEGO</button>
      </div>
    </div>

    <!-- CARTAS 17 A 32 -->
    <div class="baraja" id="barajaDer"></div>

  </div>

  <div style="text-align:center">
    <div class="fichas-titulo">FICHAS</div>
  </div>
  <div class="fichas" id="fichas"></div>

</div>

<script>
const CARTAS = [
  "EL GALLO","EL DIABLITO","LA DAMA","EL CATRÍN",
  "EL PARAGUAS","LA SIRENA","LA ESCALERA","LA BOTELLA",
  "EL BARRIL","EL ÁRBOL","EL MELÓN","EL VALIENTE",
  "EL GORRITO","LA MUERTE","LA PERA","LA BANDERA",
  "EL BANDOLÓN","EL VIOLONCELLO","LA GARZA","EL PÁJARO",
  "LA MANO","LA BOTA","LA LUNA","EL COTORRO",
  "EL BORRACHO","EL NEGRITO","EL CORAZÓN","LA ARAÑA",
  "EL CAMARÓN","EL TAMBOR","LA SANDÍA","LAS JARAS"
];

let cartasDisponibles = [];
let cartasSalidas = new Set();
let automatico = null;
let fichasActivas = new Set();

function urlCarta(n){
  return `https://loteria.loteria-mexicana.mx/images/cartas/${n}.jpg`;
}

function crearBaraja(){
  const izq = document.getElementById("barajaIzq");
  const der = document.getElementById("barajaDer");
  izq.innerHTML = "";
  der.innerHTML = "";

  for(let n=1;n<=32;n++){
    const div = document.createElement("div");
    div.className = "carta-mini";
    div.id = "cartaMini" + n;
    div.innerHTML = `
      <span class="numero">${n}</span>
      <img src="${urlCarta(n)}" alt="${CARTAS[n-1]}">
      <div class="tapada">SALIDA</div>
    `;

    if(n<=16) izq.appendChild(div);
    else der.appendChild(div);
  }
}

function crearFichas(){
  const cont = document.getElementById("fichas");
  cont.innerHTML = "";

  for(let n=1;n<=20;n++){
    const b = document.createElement("button");
    b.className = "ficha";
    b.textContent = n;
    b.onclick = () => toggleFicha(n);
    b.id = "ficha" + n;
    cont.appendChild(b);
  }
}

function toggleFicha(n){
  const b = document.getElementById("ficha"+n);

  if(fichasActivas.has(n)){
    fichasActivas.delete(n);
    b.classList.remove("activa");
  }else{
    fichasActivas.add(n);
    b.classList.add("activa");
  }
}

function prepararBaraja(){
  cartasDisponibles = Array.from({length:32},(_,i)=>i+1);
  cartasSalidas.clear();

  for(let n=1;n<=32;n++){
    document.getElementById("cartaMini"+n).classList.remove("salio");
  }

  document.getElementById("estado").textContent = "32 cartas disponibles.";
}

function gritarCarta(){
  if(cartasDisponibles.length===0){
    detenerAutomatico();
    document.getElementById("estado").textContent = "🎉 ¡YA SALIERON LAS 32 CARTAS!";
    return;
  }

  // Elegir una carta al azar de las que todavía no han salido
  const posicion = Math.floor(Math.random()*cartasDisponibles.length);
  const numero = cartasDisponibles.splice(posicion,1)[0];

  cartasSalidas.add(numero);

  document.getElementById("cartaActual").src = urlCarta(numero);
  document.getElementById("cartaActual").alt = CARTAS[numero-1];
  document.getElementById("numeroActual").textContent = numero;
  document.getElementById("nombreActual").textContent = CARTAS[numero-1];

  // Tapar automáticamente la carta que acaba de salir
  document.getElementById("cartaMini"+numero).classList.add("salio");

  document.getElementById("estado").textContent =
    `Carta ${numero}: ${CARTAS[numero-1]} — quedan ${cartasDisponibles.length}`;

  // Voz
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
    const voz = new SpeechSynthesisUtterance(CARTAS[numero-1]);
    voz.lang = "es-MX";
    voz.rate = .85;
    voz.pitch = 1;
    speechSynthesis.speak(voz);
  }
}

function alternarAutomatico(){
  if(automatico){
    detenerAutomatico();
  }else{
    document.getElementById("btnAuto").textContent = "⏸ DETENER";
    gritarCarta();
    automatico = setInterval(gritarCarta, 4000);
  }
}

function detenerAutomatico(){
  if(automatico){
    clearInterval(automatico);
    automatico = null;
  }
  document.getElementById("btnAuto").textContent = "▶ AUTOMÁTICO";
}

function nuevoJuego(){
  detenerAutomatico();
  fichasActivas.clear();

  for(let n=1;n<=20;n++){
    const b=document.getElementById("ficha"+n);
    if(b) b.classList.remove("activa");
  }

  prepararBaraja();

  document.getElementById("cartaActual").src = urlCarta(1);
  document.getElementById("numeroActual").textContent = "—";
  document.getElementById("nombreActual").textContent = "LISTO";
}

window.addEventListener("DOMContentLoaded",()=>{
  crearBaraja();
  crearFichas();
  nuevoJuego();
});
</script>
</body>
</html>
