<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loteria Don Clemente</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f5f2ea}
.topbar{background:#0a2a4a;color:#fff;text-align:center;padding:6px;border-bottom:4px solid #ffee00}
.contenedor{width:100%;padding:4px}
.encabezado{display:flex;justify-content:space-between;padding:0 10px;font-weight:900}
.tablero{display:grid;grid-template-columns:50px 1fr 220px 1fr 50px;gap:4px}
.baraja{border:3px solid #c99b35;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px;border-radius:6px;min-height:200px}
.carta{aspect-ratio:.72;background:#ddd;display:flex;align-items:center;justify-content:center;font-weight:900;border-radius:4px;position:relative;overflow:hidden}
.carta img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.carta.salio{outline:3px solid #ffee00;background:#0a2a4a;color:#ffee00}
.cliente{width:44px;height:44px;border-radius:50%;background:#c99b35;color:#fff;border:3px solid #fff;font-weight:900;margin:3px auto;display:flex;align-items:center;justify-content:center}
.centro{text-align:center}
.monto{border:3px solid #c99b35;background:#fff;font-size:28px;font-weight:900;border-radius:8px}
.carta-grande{width:200px;height:280px;margin:6px auto;background:#fff;border:4px solid #c99b35;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;position:relative;overflow:hidden}
.carta-grande img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
button{padding:8px 10px;border:0;border-radius:6px;font-weight:900;margin:2px}
#gritar{background:#ffee00}
#auto{background:#0a2a4a;color:#fff}
#nuevo{background:#7030a0;color:#fff}
</style>
</head>
<body>
<div class="topbar">LOTERIA DON CLEMENTE</div>
<div class="contenedor">
<div class="encabezado"><div>$20</div><div>1ra:100 2da:100 3ra:100</div></div>
<div class="tablero">
<div id="cIzq"></div>
<div class="baraja" id="bIzq"></div>
<div class="centro">
<div style="background:#111;color:#fff;border-radius:8px;font-size:12px;padding:2px">ACUMULADO</div>
<div class="monto">80</div>
<div class="carta-grande" id="cG"><span id="cGtxt">1</span><img id="cGimg" style="display:none" onerror="this.style.display='none'"></div>
<div id="nombre" style="font-weight:900">LISTO</div>
<div id="estado" style="font-size:12px;font-weight:900">54 disponibles</div>
<button id="gritar" onclick="gritar()">GRITAR</button>
<button id="auto" onclick="auto()">AUTO</button>
<button id="nuevo" onclick="nuevo()">NUEVO</button>
</div>
<div class="baraja" id="bDer"></div>
<div id="cDer"></div>
</div>
</div>
<script>
const N=["EL GALLO","EL DIABLITO","LA DAMA","EL CATRIN","EL PARAGUAS","LA SIRENA","LA ESCALERA","LA BOTELLA","EL BARRIL","EL ARBOL","EL MELON","EL VALIENTE","EL GORRITO","LA MUERTE","LA PERA","LA BANDERA","EL BANDOLON","EL VIOLONCELLO","LA GARZA","EL PAJARO","LA MANO","LA BOTA","LA LUNA","EL COTORRO","EL BORRACHO","EL NEGRITO","EL CORAZON","LA SANDIA","EL TAMBOR","EL CAMARON","LAS JARAS","EL MUSICO","LA ARAÑA","EL SOLDADO","LA ESTRELLA","EL CAZO","EL MUNDO","EL APACHE","EL NOPAL","EL ALACRAN","LA ROSA","LA CALAVERA","LA CAMPANA","EL CANTARITO","EL VENADO","EL SOL","LA CORONA","LA CHALUPA","EL PINO","EL PESCADO","LA PALMA","LA MACETA","EL ARPA","LA RANA"];
let disp=[],sal=new Set(),timer=null,gan=new Set(),prem=0;
function ficha(n){let d=document.createElement("div");d.className="cliente";d.id="cl"+n;d.textContent=n;return d}
function initClientes(){let iz=document.getElementById("cIzq"),de=document.getElementById("cDer");iz.innerHTML="";de.innerHTML="";for(let i=1;i<=10;i++)iz.appendChild(ficha(i));for(let i=11;i<=20;i++)de.appendChild(ficha(i))}
function initBaraja(){let a=document.getElementById("bIzq"),b=document.getElementById("bDer");a.innerHTML="";b.innerHTML="";for(let i=1;i<=32;i++){let c=document.createElement("div");c.className="carta";c.id="m"+i;c.innerHTML=`<span>${i}</span><img src="CARTAS/${i}.jpg" onerror="this.style.display='none'">`;if(i<=16)a.appendChild(c);else b.appendChild(c)}}
function prep(){disp=[...Array(54).keys()].map(i=>i+1);sal.clear();prem=0;gan.clear();document.querySelectorAll(".carta").forEach(e=>e.classList.remove("salio"));document.getElementById("estado").textContent="54 disponibles"}
function gritar(){if(!disp.length)return;let k=Math.floor(Math.random()*disp.length);let n=disp.splice(k,1)[0];sal.add(n);document.getElementById("cGtxt").textContent=n;let img=document.getElementById("cGimg");img.src=`CARTAS/${n}.jpg`;img.style.display="block";img.onerror=()=>{img.style.display="none"};document.getElementById("nombre").textContent=N[n-1];document.getElementById("estado").textContent=n+" - "+N[n-1]+" - quedan "+disp.length;let mm=document.getElementById("m"+n);if(mm)mm.classList.add("salio");comp()}
const LIN={1:[1,2,3,4],2:[5,6,7,8],3:[9,10,11,12],4:[13,14,15,16],5:[17,18,19,20],6:[21,22,23,24],7:[25,26,27,28],8:[29,30,31,32],9:[1,6,11,16],10:[17,22,27,32],11:[4,9,14,19],12:[13,18,23,28],13:[5,10,15,20],14:[8,13,18,23],15:[2,7,12,17],16:[16,21,26,31],17:[3,8,13,18],18:[15,20,25,30],19:[4,14,24,32],20:[1,11,21,31]};
function comp(){for(let c=1;c<=20;c++){if(gan.has(c))continue;if(LIN[c].every(x=>sal.has(x))){gan.add(c);prem++;let f=document.getElementById("cl"+c);if(f){f.style.background="#111";f.style.color="#ffee00";f.textContent=prem}alert("LOTERIA CLIENTE "+c+" PREMIO "+prem);if(prem>=3){clearInterval(timer);timer=null}}}}
function auto(){if(timer){clearInterval(timer);timer=null;document.getElementById("auto").textContent="AUTO";return}document.getElementById("auto").textContent="PARAR";gritar();timer=setInterval(gritar,2000)}
function nuevo(){if(timer){clearInterval(timer);timer=null}document.querySelectorAll(".cliente").forEach(e=>{e.style.background="#c99b35";e.style.color="#fff";e.textContent=e.id.replace("cl","")});prep()}
initClientes();initBaraja();prep();
</script>
</body>
</html>
